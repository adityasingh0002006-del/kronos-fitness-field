{% extends "base.html" %}

{% block title %}ATHLETE CHECK-IN // KRONOS FITNESS FIELD{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12 sm:py-20">
  
  <!-- Outer Tactical Container -->
  <div class="gritty-card rivet-corner p-6 sm:p-8 border-2 border-zinc-800 relative overflow-hidden">
    
    <!-- Top Hazard Strip -->
    <div class="h-1 w-full hazard-stripe absolute top-0 left-0"></div>

    <!-- Header / Badge -->
    <div class="text-center mb-8 pt-2">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-yellow-400 text-black mb-3 font-black text-2xl shadow-lg shadow-yellow-400/20">
        <i class="fa-solid fa-dumbbell"></i>
      </div>
      <h1 class="text-3xl font-stencil font-black tracking-wider text-white">WAR ROOM ACCESS</h1>
      <p class="text-xs font-tactical text-zinc-400 mt-1 uppercase tracking-widest">
        KRONOS FITNESS FIELD // ATHLETE TERMINAL
      </p>
      <div class="mt-2 text-[11px] text-yellow-400 font-tactical flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-location-dot"></i> Sanigawan Rd, Kanpur
      </div>
    </div>

    <!-- Login Form -->
    <form action="/login" method="POST" class="space-y-5">
      <div>
        <label for="username" class="block text-xs font-tactical text-zinc-300 uppercase tracking-wider mb-2 flex items-center justify-between">
          <span><i class="fa-solid fa-id-card text-yellow-400 mr-1.5"></i> Athlete ID / Phone</span>
          <span class="text-[10px] text-zinc-400">10 Digits</span>
        </label>
        <div class="relative">
          <input 
            type="text" 
            id="username" 
            name="username" 
            required 
            placeholder="e.g. 9876543210" 
            value="{{ username or '' }}"
            class="w-full bg-zinc-950 border border-zinc-700 focus:border-yellow-400 text-white px-4 py-3 text-sm font-tactical tracking-wider focus:outline-none focus:ring-1 focus:ring-yellow-400 transition"
          >
          <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-zinc-400 text-xs">
            <i class="fa-solid fa-phone"></i>
          </div>
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-tactical text-zinc-300 uppercase tracking-wider mb-2 flex items-center justify-between">
          <span><i class="fa-solid fa-lock text-yellow-400 mr-1.5"></i> Access Key / Password</span>
          <a href="#" onclick="alert('Contact Gym Front Desk at Sanigawan Rd for password reset.'); return false;" class="text-[10px] text-zinc-400 hover:text-yellow-400 transition">Forgot?</a>
        </label>
        <div class="relative">
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            placeholder="••••••••" 
            class="w-full bg-zinc-950 border border-zinc-700 focus:border-yellow-400 text-white px-4 py-3 text-sm font-tactical tracking-wider focus:outline-none focus:ring-1 focus:ring-yellow-400 transition"
          >
          <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-zinc-400 text-xs">
            <i class="fa-solid fa-key"></i>
          </div>
        </div>
      </div>

      <button 
        type="submit" 
        class="w-full bg-yellow-400 hover:bg-yellow-300 text-black font-stencil font-black text-lg py-3 tracking-wider uppercase transition-all transform active:scale-[0.99] flex items-center justify-center gap-2 shadow-lg shadow-yellow-400/20"
      >
        <i class="fa-solid fa-bolt"></i> ENTER WAR ROOM
      </button>
    </form>

    <!-- Demo Credentials Quick-Fill Accordion -->
    <div class="mt-8 pt-6 border-t border-zinc-800">
      <div class="text-[11px] font-tactical text-zinc-400 uppercase tracking-wider mb-3 flex items-center justify-between">
        <span><i class="fa-solid fa-circle-info text-yellow-400 mr-1"></i> Quick Demo Athletes:</span>
        <span class="text-emerald-400 text-[10px]">Ready to test</span>
      </div>
      
      <div class="grid grid-cols-1 gap-2 text-xs font-tactical">
        <button 
          type="button" 
          onclick="fillDemo('9876543210', 'member123')"
          class="text-left bg-zinc-900/90 hover:bg-zinc-800 border border-zinc-700 hover:border-yellow-400/60 p-2.5 transition flex items-center justify-between group"
        >
          <div>
            <div class="text-white font-bold group-hover:text-yellow-400 transition">Arjun Patel <span class="text-[10px] text-zinc-400 font-normal">(With Diet Plan)</span></div>
            <div class="text-zinc-400 text-[11px]">ID: 9876543210 &bull; Pass: member123</div>
          </div>
          <span class="text-[10px] bg-yellow-400/10 text-yellow-400 border border-yellow-400/30 px-2 py-0.5 font-bold">CLICK TO LOAD</span>
        </button>

        <button 
          type="button" 
          onclick="fillDemo('9123456780', 'member123')"
          class="text-left bg-zinc-900/90 hover:bg-zinc-800 border border-zinc-700 hover:border-yellow-400/60 p-2.5 transition flex items-center justify-between group"
        >
          <div>
            <div class="text-white font-bold group-hover:text-yellow-400 transition">Priya Sharma <span class="text-[10px] text-zinc-400 font-normal">(Standard Split)</span></div>
            <div class="text-zinc-400 text-[11px]">ID: 9123456780 &bull; Pass: member123</div>
          </div>
          <span class="text-[10px] bg-yellow-400/10 text-yellow-400 border border-yellow-400/30 px-2 py-0.5 font-bold">CLICK TO LOAD</span>
        </button>
      </div>
    </div>

    <!-- Switch to Staff Portal -->
    <div class="mt-6 text-center">
      <a href="/admin/login" class="text-xs font-tactical text-zinc-400 hover:text-red-400 transition inline-flex items-center gap-1.5">
        <i class="fa-solid fa-shield-halved text-red-500"></i> Are you gym staff or coach? Enter Staff Command &rarr;
      </a>
    </div>

  </div>
</div>

<script>
  function fillDemo(username, password) {
    document.getElementById('username').value = username;
    document.getElementById('password').value = password;
  }
</script>
{% endblock %}
